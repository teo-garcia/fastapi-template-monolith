name: Security Scan

on:
  schedule:
    - cron: "0 9 * * 1"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/security-scan.yml"
      - "docker/**"
      - "docker-compose*.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shared-security:
    name: Shared security policy
    permissions:
      contents: read
      security-events: write
    uses: teo-garcia/templates/.github/workflows/reusable-security.yml@e0aa52f1d25edeac907bf1dcf2243af4d958e5e0 # delivery-v0.2.0

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Audit dependencies
        run: uv run --with pip-audit pip-audit
