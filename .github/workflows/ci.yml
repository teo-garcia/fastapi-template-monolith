name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_monolith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create test environment file
        run: cp .env.test.example .env.test

      - name: Generate Ruff shared config
        run: printf 'extend = "%s"\n' "$(uv run teo-ruff-config-path)" > ruff.extend.toml

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

      - name: Test
        run: uv run pytest --cov --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fastapi_monolith_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      - name: Migrate conformance database
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fastapi_monolith_test

      - name: Start conformance server
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fastapi_monolith_test
          METRICS_ENABLED: "true"
          OTEL_ENABLED: "false"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          THROTTLE_LIMIT: 1000/minute
        run: |
          uv run gunicorn app.main:app -k uvicorn_worker.UvicornWorker --bind 127.0.0.1:43118 --workers 1 > "$RUNNER_TEMP/backend-conformance.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/backend-conformance.pid"

      - name: Shared backend conformance
        uses: teo-garcia/templates/conformance/backend@da8df26c4c9a9f0299d227be6164898301e1888f
        with:
          base_url: http://127.0.0.1:43118

      - name: Upload conformance log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-conformance-log
          path: ${{ runner.temp }}/backend-conformance.log
          retention-days: 7

      - name: Stop conformance server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backend-conformance.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/backend-conformance.pid")" 2>/dev/null || true
          fi
